name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Scene, TypeScript and web build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.1
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:layout-export
      - run: node --test spikes/integration/oracle.test.mjs
      - run: npm run build

  windows-host:
    name: Windows Rust host
    runs-on: windows-2025
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.11.1
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Install project-local pinned Rust
        shell: pwsh
        run: ./scripts/bootstrap-rust.ps1
      - name: Rust host tests (no submitted C++ execution)
        shell: pwsh
        run: ./scripts/tauri.ps1 test
      - name: Rust host check
        shell: pwsh
        run: ./scripts/tauri.ps1 check

# Native Clang build, interactive WebView2 E2E and clean-Windows acceptance
# are separate documented gates; these jobs do not claim to cover them.
