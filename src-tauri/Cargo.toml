[package]
name = "flowsketch"
version = "0.1.0"
description = "Educational C++ flowcharts for Windows"
edition = "2021"
license = "MIT"
repository = "https://github.com/at-flixy/FlowSketch"

[lib]
name = "flowsketch_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
hex = "0.4"
tauri-plugin-wdio-webdriver = { version = "=1.5.0", optional = true }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_Diagnostics_ToolHelp", "Win32_System_Diagnostics_Debug", "Win32_System_IO", "Win32_System_SystemServices"] }

[profile.dev]
debug = 1

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"

[features]
custom-protocol = ["tauri/custom-protocol"]
webdriver = ["dep:tauri-plugin-wdio-webdriver"]
